databases:
  - name: shopverse-db
    plan: free
    databaseName: shopverse
    user: shopverse

services:
  - type: web
    name: backend
    runtime: docker
    repo: https://github.com/Akhil200530/ShopVerse.git
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopverse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SQLITE_FALLBACK
        value: "0"
      - key: CORS_ORIGINS
        value: https://shopverse-frontend.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://shopverse-frontend.onrender.com/orders?reference={CHECKOUT_SESSION_ID}&stripe=1
      - key: STRIPE_CANCEL_URL
        value: https://shopverse-frontend.onrender.com/cart

  - type: web
    name: shopverse-frontend
    runtime: docker
    repo: https://github.com/Akhil200530/ShopVerse.git
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: BACKEND_URL
        value: backend